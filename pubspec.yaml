name: strava_auto
description: "Strava Auto - Upload Tool for Strava"
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.11.0

dependencies:
  app_links: ^7.0.0
  archive: ^4.0.9
  cross_file: ^0.3.5+2
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  desktop_drop: ^0.7.1
  dio: ^5.9.2
  envied: ^1.3.4
  file_picker: ^11.0.2
  fit_tool: ^1.0.5
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pointycastle: ^4.0.0
  receive_sharing_intent: ^1.8.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  web: ^1.1.1
  win32_registry: ^2.1.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  envied_generator: ^1.3.4
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false
    image_path: "assets/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FC4C02"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/strava.png
